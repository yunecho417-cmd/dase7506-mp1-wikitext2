<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="930" viewBox="0 0 1640 930"><style>text{font-family:Arial,Helvetica,sans-serif}.head{font-size:22px;font-weight:700;fill:#26333A}.body{font-size:18px;fill:#26333A}.meaning{font-size:17px;font-weight:700;fill:#647178}.decision{font-size:18px;font-weight:700;fill:#3F7188}</style><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#73838A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="35" y="30" width="355" height="345" rx="13" fill="#F1F6F8" stroke="#4F8099" stroke-width="2.3"/><text class="head" x="59" y="68">1 Separate block effects</text><text class="body" x="59" y="124">SwiGLU main effect −0.055444</text><text class="body" x="59" y="150">RMSNorm main effect −0.005725</text><text class="body" x="59" y="176">interaction only +0.000879</text><text class="meaning" x="59" y="210">Observed consequence</text><text class="body" x="59" y="238">Most block gain comes from SwiGLU.</text><text class="decision" x="59" y="320">Keep RMSNorm + SwiGLU; test</text><text class="decision" x="59" y="345">capacity.</text><rect x="440" y="30" width="355" height="345" rx="13" fill="#F1F6F8" stroke="#4F8099" stroke-width="2.3"/><text class="head" x="464" y="68">2 Capacity and regularisation</text><text class="body" x="464" y="124">w256 +0.022691; w288 +0.011753</text><text class="body" x="464" y="150">dropout 0.05 +0.033451</text><text class="body" x="464" y="176">droppath 0.1 +0.045020</text><text class="meaning" x="464" y="210">Observed consequence</text><text class="body" x="464" y="238">Smaller models and added noise</text><text class="body" x="464" y="264">hurt.</text><text class="decision" x="464" y="320">Keep w320 d8; stop adding</text><text class="decision" x="464" y="345">regularisation.</text><rect x="845" y="30" width="355" height="345" rx="13" fill="#F2F7F4" stroke="#5C907A" stroke-width="2.3"/><text class="head" x="869" y="68">3 Position and extra</text><text class="head" x="869" y="96">components</text><text class="body" x="869" y="152">RoPE improves two short seeds</text><text class="body" x="869" y="178">untied mean gain only −0.006750</text><text class="body" x="869" y="204">EMA / MTP remain below noise</text><text class="meaning" x="869" y="238">Observed consequence</text><text class="body" x="869" y="266">RoPE is the only stable direction.</text><text class="decision" x="869" y="320">Run long RoPE with tied</text><text class="decision" x="869" y="345">weights.</text><rect x="1250" y="30" width="355" height="345" rx="13" fill="#F2F7F4" stroke="#5C907A" stroke-width="2.3"/><text class="head" x="1274" y="68">4 Regression changes</text><text class="head" x="1274" y="96">selection</text><text class="body" x="1274" y="152">first long run: 1.620751 at 19.66M</text><text class="body" x="1274" y="178">then 1.634776 at 28.91M</text><text class="body" x="1274" y="204">three seeds choose 19.66M</text><text class="meaning" x="1274" y="238">Observed consequence</text><text class="body" x="1274" y="266">More targets do not ensure</text><text class="body" x="1274" y="292">improvement.</text><text class="decision" x="1274" y="320">Predeclare checks; freeze seed</text><text class="decision" x="1274" y="345">137 as v2.</text><path d="M 390 202 L 440 202" fill="none" stroke="#73838A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 795 202 L 845 202" fill="none" stroke="#73838A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 1200 202 L 1250 202" fill="none" stroke="#73838A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 1427 375 L 1427 455 L 212 455 L 212 500" fill="none" stroke="#73838A" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="500" width="355" height="345" rx="13" fill="#FBF5EE" stroke="#A47D5F" stroke-width="2.3"/><text class="head" x="59" y="538">5 Establish the noise floor</text><text class="body" x="59" y="594">three identical runs: σ = 0.010213</text><text class="body" x="59" y="620">20M–28.9M horizon changes &lt; 2σ</text><text class="body" x="59" y="646">single-point gains are unreliable</text><text class="meaning" x="59" y="680">Observed consequence</text><text class="body" x="59" y="708">Longer training is not a clean</text><text class="body" x="59" y="734">lever.</text><text class="decision" x="59" y="790">Hold target budget; require</text><text class="decision" x="59" y="815">replications.</text><rect x="440" y="500" width="355" height="345" rx="13" fill="#FBF5EE" stroke="#A47D5F" stroke-width="2.3"/><text class="head" x="464" y="538">6 Scan batch at one budget</text><text class="body" x="464" y="594">batch 32 → 8 → 4 improves</text><text class="body" x="464" y="620">1.605134 → 1.582448 → 1.568646</text><text class="body" x="464" y="646">batch 2 / 1 rebound at lr 1e-3</text><text class="meaning" x="464" y="680">Observed consequence</text><text class="body" x="464" y="708">Step count helps until noise</text><text class="body" x="464" y="734">dominates.</text><text class="decision" x="464" y="790">Keep batch 4; re-sweep learning</text><text class="decision" x="464" y="815">rate.</text><rect x="845" y="500" width="355" height="345" rx="13" fill="#F4F2F7" stroke="#837495" stroke-width="2.3"/><text class="head" x="869" y="538">7 Re-sweep rate and</text><text class="head" x="869" y="566">calibration</text><text class="body" x="869" y="622">1.5e-3 and 2.5e-3 are close</text><text class="body" x="869" y="648">intervening 2e-3 is weaker</text><text class="body" x="869" y="674">T = 1.075 gains 0.007392</text><text class="meaning" x="869" y="708">Observed consequence</text><text class="body" x="869" y="736">No continuous LR plateau is</text><text class="body" x="869" y="762">established.</text><text class="decision" x="869" y="790">Freeze 1.5e-3; compare</text><text class="decision" x="869" y="815">calibrated scores.</text><rect x="1250" y="500" width="355" height="345" rx="13" fill="#F4F2F7" stroke="#837495" stroke-width="2.3"/><text class="head" x="1274" y="538">8 Replicate the tempting</text><text class="head" x="1274" y="566">alternative</text><text class="body" x="1274" y="622">bs2 + 2e-3 first appears better</text><text class="body" x="1274" y="648">replicate mean 1.551793</text><text class="body" x="1274" y="674">calibrated v3 = 1.549498</text><text class="meaning" x="1274" y="708">Observed consequence</text><text class="body" x="1274" y="736">The apparent gain vanishes on</text><text class="body" x="1274" y="762">replication.</text><text class="decision" x="1274" y="790">Freeze v3; next use a paired</text><text class="decision" x="1274" y="815">batch × LR matrix.</text><path d="M 390 672 L 440 672" fill="none" stroke="#73838A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 795 672 L 845 672" fill="none" stroke="#73838A" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 1200 672 L 1250 672" fill="none" stroke="#73838A" stroke-width="2.5" marker-end="url(#arrow)"/></svg>