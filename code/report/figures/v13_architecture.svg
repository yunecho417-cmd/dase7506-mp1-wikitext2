<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20282D}.lane{font-size:18px;font-weight:700}.head{font-size:14px;font-weight:700}.body{font-size:12px}.note{font-size:12px;fill:#536168}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4F5D63"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text class="lane" x="40" y="34">1  Training data</text><rect x="40" y="50" width="210" height="82" rx="7" fill="#EDF4F7" stroke="#75838A" stroke-width="1.4"/><text class="head" x="145.0" y="75" text-anchor="middle">WikiText-2 train</text><text class="body" x="145.0" y="96" text-anchor="middle">raw UTF-8 bytes</text><rect x="295" y="50" width="210" height="82" rx="7" fill="#EDF4F7" stroke="#75838A" stroke-width="1.4"/><text class="head" x="400.0" y="75" text-anchor="middle">Integrity check</text><text class="body" x="400.0" y="96" text-anchor="middle">SHA-256 manifest</text><line x1="250" y1="91" x2="295" y2="91" stroke="#4F5D63" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="550" y="50" width="210" height="82" rx="7" fill="#EDF4F7" stroke="#75838A" stroke-width="1.4"/><text class="head" x="655.0" y="75" text-anchor="middle">BPE tokenizer</text><text class="body" x="655.0" y="96" text-anchor="middle">fixed vocabulary 2048</text><line x1="505" y1="91" x2="550" y2="91" stroke="#4F5D63" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="805" y="50" width="210" height="82" rx="7" fill="#EDF4F7" stroke="#75838A" stroke-width="1.4"/><text class="head" x="910.0" y="75" text-anchor="middle">Token IDs</text><text class="body" x="910.0" y="96" text-anchor="middle">N = 3,613,343</text><line x1="760" y1="91" x2="805" y2="91" stroke="#4F5D63" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1060" y="50" width="210" height="82" rx="7" fill="#EDF4F7" stroke="#75838A" stroke-width="1.4"